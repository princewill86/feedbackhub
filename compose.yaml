services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: feedbackhub
      POSTGRES_PASSWORD: feedbackhub
      POSTGRES_DB: feedbackhub
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'feedbackhub', '-d', 'feedbackhub']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
